[project]
name            = "lean-algo-template"
version         = "0.1.0"
description     = "Modular algorithmic trading strategy template for QuantConnect LEAN"
readme          = "README.md"
requires-python = ">=3.11"
authors         = [{name = "sam41306061"}]
dependencies    = [
    "lean>=1.0.223",
    "quantconnect-stubs>=17512",
    "pandas>=2.3.3",
    "numpy>=2.2.6",
    "matplotlib>=3.10.8",
    "pydantic>=2.12.5",
    "requests>=2.32.5",
    "docker>=7.1.0",
    "cryptography>=46.0.4",
    "rich>=14.3.2",
]

[tool.poetry]
package-mode = false

# =============================================================================
# DEV DEPENDENCIES
# =============================================================================

[tool.poetry.group.dev.dependencies]
pytest          = "^9.0.2"
pytest-cov      = "^7.0.0"
coverage        = "^7.13.3"
black           = "^26.1.0"
mypy            = "^1.19.1"
pylint          = "^4.0.4"
isort           = "^7.0.0"
memray          = ">=1.5.0"
pytest-memray   = ">=1.5.0"

# =============================================================================
# RAG DEPENDENCIES (optional — install with: poetry install --with rag)
# =============================================================================

[tool.poetry.group.rag]
optional = true

[tool.poetry.group.rag.dependencies]
playwright      = ">=1.40.0"
markdownify     = ">=0.12.0"
rank-bm25       = ">=0.2.2"
beautifulsoup4  = ">=4.12.0"
lxml            = ">=5.0.0"

[build-system]
requires      = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# =============================================================================
# TOOL CONFIGURATIONS
# =============================================================================

[tool.pytest.ini_options]
testpaths   = ["tests"]
addopts     = "--cov=handlers --cov-report=term-missing --cov-report=html"
python_files    = ["test_*.py", "*_test.py"]
python_classes  = ["Test*"]
python_functions = ["test_*"]
markers = [
    "longevity: memory-leak longevity tests (run with --memray for flamegraphs)",
]

# -----------------------------------------------------------------------------

[tool.black]
line-length    = 100
target-version = ["py311"]
include        = '\.pyi?$'

# -----------------------------------------------------------------------------

[tool.isort]
profile    = "black"
line_length = 100
src_paths  = ["src", "tests"]

# -----------------------------------------------------------------------------

[tool.mypy]
python_version      = "3.11"
strict              = true
warn_return_any     = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["tests/"]

# -----------------------------------------------------------------------------

[tool.pylint.main]
source-roots = ["src"]

[tool.pylint.format]
max-line-length = 100

[tool.pylint."messages control"]
disable = ["C0114", "C0115", "C0116"]

# -----------------------------------------------------------------------------

[tool.coverage.run]
source = ["src"]
omit   = ["tests/*", "**/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under   = 80
